<ion-split-pane contentId="admin-content" when="lg">
  <ion-menu menuId="admin-menu" contentId="admin-content" type="overlay">
    <ion-header class="ion-no-border">
      <div class="brand">
        <span class="brand-mark"><ion-icon name="radio-outline"></ion-icon></span>
        <span><strong>NetControl</strong><small>ISP Administration</small></span>
      </div>
    </ion-header>

    <ion-content>
      <div class="admin-card">
        <ion-avatar>{{ initials() }}</ion-avatar>
        <span><strong>{{ auth.admin()?.name || 'Administrator' }}</strong><small>{{ auth.admin()?.email || 'Loading account…' }}</small></span>
      </div>

      <p class="nav-label">Workspace</p>
      <ion-list lines="none">
        @for (item of navItems; track item.route) {
          <ion-item [routerLink]="item.route" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
            <ion-icon slot="start" [name]="item.icon"></ion-icon>
            <ion-label>{{ item.label }}</ion-label>
          </ion-item>
        }
      </ion-list>
      <ion-button class="logout" fill="clear" expand="block" (click)="logout()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>Log out
      </ion-button>
    </ion-content>

    <footer><span class="live-dot"></span>System API connected</footer>
  </ion-menu>

  <div class="main-shell" id="admin-content">
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-buttons slot="start"><ion-menu-button menu="admin-menu"></ion-menu-button></ion-buttons>
        <ion-title>Network Operations</ion-title>
        <ion-buttons slot="end">
          <ion-button routerLink="/settings" aria-label="Open administrator profile">
            <span class="toolbar-avatar">{{ initials() }}</span>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="workspace"><router-outlet></router-outlet></ion-content>
  </div>
</ion-split-pane>
