<section class="status-card" [attr.data-tone]="tone()" aria-live="polite">
  <span class="status-card__icon" aria-hidden="true"></span>
  <div>
    <p class="status-card__label">{{ label() }}</p>
    <p class="status-card__value">{{ status() | uppercase }}</p>
    @if (description()) {
      <p class="status-card__description">{{ description() }}</p>
    }
  </div>
</section>
